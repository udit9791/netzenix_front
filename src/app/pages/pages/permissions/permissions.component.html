<div class="p-6 container">
  <div class="card flex-auto">
    <div class="px-6 py-4 border-b flex items-center justify-between">
      <h2 class="title m-0">Role & Permissions</h2>
    </div>

    <div class="px-6 py-4 flex flex-col gap-6" [formGroup]="roleForm">
      <!-- Role Dropdown -->
      <mat-form-field>
        <mat-label>Select Role</mat-label>
        <mat-select formControlName="role" (selectionChange)="onRoleChange($event.value)">
          <mat-option *ngFor="let role of roles" [value]="role.id">
            {{ role.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Add New Role -->
      <div class="flex gap-2 items-center">
       
        <button mat-flat-button color="primary" (click)="addNewRole()">Add Role</button>
      </div>

      <!-- Permissions List -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div
          *ngFor="let group of groupedPermissions"
          class="border rounded p-3 flex flex-col gap-2"
        >
          <div class="font-medium">{{ group.groupLabel }}</div>
          <div class="border-b border-gray-200 my-1"></div>
          <div class="flex flex-col gap-2">
            <div
              *ngFor="let module of group.modules"
              class="flex flex-col gap-2"
            >
              <div class="text-sm font-medium text-indigo-600">
                {{ module.moduleLabel }}
              </div>
              <div class="h-px w-full bg-indigo-200 mb-1"></div>
              <div class="flex flex-wrap gap-3">
                <mat-checkbox
                  *ngFor="let act of module.actions"
                  [checked]="selectedPermissions.has(act.name)"
                  (change)="togglePermission(act.name, $event.checked)"
                >
                  {{ act.label }}
                </mat-checkbox>
              </div>
            </div>
          </div>
        </div>

        <div
          *ngIf="otherPermissions.length"
          class="border rounded p-3 flex flex-col gap-2"
        >
          <div class="font-medium">Other</div>
          <div class="flex flex-col gap-1">
            <mat-checkbox
              *ngFor="let perm of otherPermissions"
              [checked]="selectedPermissions.has(perm.name || perm)"
              (change)="togglePermission(perm.name || perm, $event.checked)"
            >
              {{ formatPermissionLabel(perm.name || perm) }}
            </mat-checkbox>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <div class="flex justify-end">
        <button mat-flat-button color="primary" (click)="savePermissions()">Save Permissions</button>
      </div>
    </div>
  </div>
</div>
