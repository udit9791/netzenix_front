<mat-card class="itinerary-builder">
  <mat-card-header>
    <mat-card-title>Itinerary Builder</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="list-header">
      <h3>Itineraries</h3>
      <a mat-stroked-button color="primary" [routerLink]="['/sale/itinerary-builder/add']">
        <mat-icon>add</mat-icon>
        Add Itinerary
      </a>
    </div>

    <table mat-table [dataSource]="items" class="full-width" *ngIf="items.length; else noItineraries">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="days">
        <th mat-header-cell *matHeaderCellDef>Days</th>
        <td mat-cell *matCellDef="let row">{{ row.days.length }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <a
            mat-icon-button
            color="primary"
            [routerLink]="['/sale/itinerary-builder/edit', row.id]"
          >
            <mat-icon>edit</mat-icon>
          </a>
          <button
            mat-icon-button
            type="button"
            color="accent"
            (click)="toggleStatus(row)"
            [matTooltip]="row.is_active === 1 ? 'Deactivate' : 'Activate'"
          >
            <mat-icon>
              {{ row.is_active === 1 ? 'toggle_on' : 'toggle_off' }}
            </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <ng-template #noItineraries>
      <p>No itineraries yet. Click "Add Itinerary" to create one.</p>
    </ng-template>
  </mat-card-content>
</mat-card>
